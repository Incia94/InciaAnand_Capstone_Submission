
name: CloudServe Solutions CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Python Quality and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch (for sentence-transformers): a fraction of the default GPU build's download
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests evaluation streamlit_app.py

      - name: Run critical lint checks
        run: |
          flake8 src tests evaluation streamlit_app.py \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Run automated tests
        run: |
          mkdir -p test-results
          python -m pytest tests/ -v \
            --tb=short \
            --junitxml=test-results/pytest.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudserve-ci-reports
          path: |
            test-results/
            coverage.xml
          if-no-files-found: ignore
